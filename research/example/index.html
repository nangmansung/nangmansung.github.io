<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예시 연구 페이지</title>
  <meta name="description" content="research 폴더에 HTML을 올리면 이렇게 Research 목록에 자동으로 추가돼요.">
  <meta name="date" content="2026-11-05">
  <style>
    body { margin: 0; font-family: "Source Sans 3", "Noto Sans KR", sans-serif; color: #333; background: #fff; line-height: 1.6; }
    header { background: #f2f8f4; padding: 48px 16px 32px; }
    main, header > div { max-width: 760px; margin: 0 auto; }
    main { padding: 24px 16px 64px; }
    a { color: #1f8a5b; }
    h1 { margin: 0 0 8px; font-weight: 600; }
  </style>
</head>
<body>
  <header><div>
    <p><a href="/research/">← Research</a></p>
    <h1>예시 연구 페이지</h1>
    <p>직접 만든 HTML 파일을 그대로 올린 페이지예요.</p>
  </div></header>
  <main>
    <p>이 파일은 <code>research/example/index.html</code> 에 있어요.</p>
    <p>제목은 <code>&lt;title&gt;</code>, 목록에 보이는 설명은 <code>&lt;meta name="description"&gt;</code>, 정렬 날짜는 <code>&lt;meta name="date" content="YYYY-MM-DD"&gt;</code> 에서 가져와요.</p>
  </main>
</body>
</html>
